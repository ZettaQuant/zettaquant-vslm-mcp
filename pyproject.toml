[project]
name = "zettaquant-vslm-mcp"
version = "0.2.0b1"
description = "Kolmo beta custom-model training and inference, plus ZettaQuant context filtering, for MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ZettaQuant", email = "support@zettaquant.ai" }
]
keywords = ["mcp", "model-context-protocol", "vslm", "zettaquant", "llm", "tools", "claude", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.28.1,<2",
  "httpx>=0.28.1,<1",
  "pydantic>=2.11,<3",
]

[project.scripts]
kolmo-mcp = "zettaquant_vslm_mcp.kolmo:main"
zettaquant-vslm-mcp = "zettaquant_vslm_mcp.server:main"

[project.urls]
Homepage = "https://zettaquant.ai"
Documentation = "https://github.com/zettaquant/zettaquant-vslm-mcp"
Source = "https://github.com/zettaquant/zettaquant-vslm-mcp"
Issues = "https://github.com/zettaquant/zettaquant-vslm-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zettaquant_vslm_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/SETUP.md", "/LICENSE", "/pyproject.toml", "/glama.json", "/Dockerfile", "/Dockerfile.kolmo"]
